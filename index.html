<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3F6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F6; --card:#FFFFFF; --ink:#1B2232; --muted:#667089; --line:#DCE0E8; --soft:#ECEFF4;
  --accent:#2C55C9; --accent-ink:#FFFFFF; --warn:#B4472E; --warn-bg:#FBEDE8; --ok:#2E7D5B; --ok-bg:#E6F4EC;
  --z2:#23917F; --thr:#D58A1F; --vo2:#BE3A68; --str:#6F55A3; --rest:#8E98AC;
  --font:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161F; --card:#1A2030; --ink:#E8ECF4; --muted:#98A2B8; --line:#2C3448; --soft:#232A3C;
    --accent:#7C9BFF; --accent-ink:#0E1424; --warn:#FF9C80; --warn-bg:#3A221C; --ok:#7FD3AA; --ok-bg:#16302A;
    --z2:#3DC1AA; --thr:#F0AE4A; --vo2:#F06A98; --str:#A68BE0; --rest:#7B859B;
  }
}
:root[data-theme="dark"]{
  --paper:#12161F; --card:#1A2030; --ink:#E8ECF4; --muted:#98A2B8; --line:#2C3448; --soft:#232A3C;
  --accent:#7C9BFF; --accent-ink:#0E1424; --warn:#FF9C80; --warn-bg:#3A221C; --ok:#7FD3AA; --ok-bg:#16302A;
  --z2:#3DC1AA; --thr:#F0AE4A; --vo2:#F06A98; --str:#A68BE0; --rest:#7B859B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:72px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.changed{border-color:var(--accent)!important}

/* Day header */
.day{position:relative;overflow:hidden;border-radius:16px;padding:12px 14px 14px;color:#fff;background:var(--zone,var(--rest));transition:background .3s}
.day::before{content:"";position:absolute;left:0;right:0;bottom:6px;height:64px;background-image:var(--pattern,none);background-repeat:repeat-x;background-size:240px 64px;animation:drift var(--speed,10s) linear infinite;pointer-events:none}
.day>*{position:relative;z-index:1}
@keyframes drift{from{background-position:0 0}to{background-position:-240px 0}}
.day-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day-nav button{background:rgba(255,255,255,.2);border:0;border-radius:999px;width:36px;height:36px;font-size:19px;color:#fff;line-height:1}
.day-nav .today{width:auto;padding:0 12px;font-size:13px;font-weight:600}
.day-title{margin:8px 0 0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.day-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px;font-size:15px}
.jump{display:inline-flex;align-items:center;gap:6px;font-weight:600;background:rgba(255,255,255,.2);border:0;border-radius:999px;padding:3px 12px;color:#fff;font-size:15px}
.day-sub a{color:#fff;opacity:.85;font-size:14px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 0}
.wd{border:0;background:var(--card);border-radius:10px;padding:6px 2px 7px;text-align:center;position:relative}
.wd .l{display:block;font-size:12px;color:var(--muted)}
.wd .n{display:block;font-size:16px;font-weight:700}
.wd .z{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:var(--z,transparent)}
.wd[aria-current="date"]{background:var(--ink);color:var(--card)}
.wd[aria-current="date"] .l{color:var(--card);opacity:.7}
.wd .dot{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

section{background:var(--card);border-radius:14px;padding:14px;margin-top:10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
h2{font-size:15px;font-weight:700;margin:0}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.hint.err{color:var(--warn)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-size:14px;font-weight:600}

/* Written-for-today card */
.plan{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;display:grid;place-items:center;font-size:13px;color:transparent;transition:background .15s,border-color .15s}
.tick[aria-checked="true"]{background:var(--z2);border-color:var(--z2);color:#fff}
.todo input{border:0;padding:4px 0;background:transparent;border-radius:0}
.todo input:focus-visible{outline:none;box-shadow:inset 0 -1px 0 var(--accent)}
.todo li.done input{text-decoration:line-through;color:var(--muted)}
.todo .del{flex:none;border:0;background:none;color:var(--muted);font-size:16px;padding:2px 4px}
.todo .new input::placeholder{color:var(--muted)}
.plan-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;min-height:18px}
.plan-act{font-weight:700;font-size:15px}
.plan-act span{font-weight:500;color:var(--muted)}
.plan-note{white-space:pre-wrap;margin-top:4px;max-height:200px;overflow:auto}
.plan-note.empty{color:var(--muted)}

/* Numbers */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.supps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.paper{white-space:pre-wrap;background:var(--paper);border-radius:8px;padding:9px 11px;margin-bottom:8px;max-height:200px;overflow:auto;word-break:break-word}
.paper.empty{color:var(--muted)}
.paper ins{text-decoration:none;color:var(--accent);font-weight:600}

/* Calendar */
.cal-bg{position:fixed;inset:0;background:rgba(10,14,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:11}
.cal-bg.open{display:flex}
.cal{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h strong{font-size:18px}
.cal-h button{border:0;background:var(--soft);border-radius:999px;width:36px;height:36px;font-size:18px}
.cal-wk,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wk{margin:12px 0 4px;font-size:12px;color:var(--muted)}
.cd{border:0;background:transparent;border-radius:10px;aspect-ratio:1/1;max-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;position:relative}
.cd .z{width:5px;height:5px;border-radius:50%;margin-top:3px;background:var(--z,transparent)}
.cd.none{color:var(--muted);opacity:.45;cursor:default}
.cd.blank{background:var(--warn-bg);color:var(--warn)}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cd[aria-current="date"]{background:var(--ink);color:var(--card)}
.cal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.cal-foot .sw{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--warn-bg);border:1px solid var(--warn);vertical-align:-2px;margin-right:6px}
.mini span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.mini input{padding:7px 9px;font-size:15px}
.mini .sub{font-size:11px;color:var(--muted);margin-top:2px;min-height:14px}
.mini .sub.err{color:var(--warn)}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--z2);border-color:var(--z2);color:#fff}
.pill.changed{box-shadow:0 0 0 2px var(--accent)}

/* Protein */
.protein-total{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.protein-total small{font-size:14px;font-weight:600;color:var(--muted)}
.formula{font-size:12px;color:var(--muted);word-break:break-all}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.adds>button{border:0;background:var(--soft);border-radius:8px;padding:8px 0;min-width:48px;font-weight:600}
.adds .custom{display:flex;gap:6px;flex:1;min-width:130px}
.adds .custom input{padding:7px 9px}
.adds .custom button{border:0;background:var(--soft);border-radius:8px;padding:0 12px;font-weight:600}
.pending{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pending button{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:2px 10px;font-size:13px}
.snacks{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.g{text-align:right;white-space:nowrap;color:var(--muted);width:56px}
td.a{text-align:right;width:1%;white-space:nowrap}
td.a button{border:0;border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px;background:var(--soft)}
td.a button.add{background:var(--accent);color:var(--accent-ink)}
.newsnack{display:grid;grid-template-columns:1fr 70px auto;gap:6px;margin-top:8px}
.newsnack button{border:0;border-radius:8px;padding:0 12px;font-weight:600;background:var(--soft)}
.saved{font-size:12px;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-msg{flex:1;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink);font-weight:600}

.banner{border-radius:10px;padding:11px 13px;margin-top:10px;font-size:15px}
.banner.err{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.info{background:var(--card);color:var(--ink)}
.banner button{margin-top:8px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{margin:0 0 2px;font-size:19px}
.ch{border-top:1px solid var(--line);padding:11px 0}
.ch-h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.rep{background:var(--warn-bg);color:var(--warn)}
.ba{font-size:14px;margin-top:3px;color:var(--muted)}
.ba b{color:var(--ink);font-weight:600}
.ba .v{white-space:pre-wrap;word-break:break-word}
.confirm{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14px;color:var(--warn)}
.confirm input{width:20px;height:20px;flex:none;margin:0}
.sheet-actions{display:flex;gap:10px;margin-top:12px}
.sheet-actions .btn{flex:1}
.skel{height:110px;border-radius:14px;background:var(--soft);margin-top:10px}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .count{font-weight:500;opacity:.8}
.pn-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 0}
.pn-ctl{display:flex;gap:8px;margin:8px 2px 2px}
.pn-top h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em}
.pn-card .wd-line{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pn-card .wd-line strong{font-size:16px}
.pn-card .wd-line a{font-size:13px;color:var(--muted)}
.pn-act{font-size:14px;font-weight:600;margin-top:2px}
.pn-ctx{font-size:14px;color:var(--muted);margin:2px 0 8px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.pn-ctx.open{display:block}
.pn-row{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.pn-row .msg{flex:1;font-size:13px;color:var(--muted)}
.pn-row .msg.err{color:var(--warn)}
.pn-card.done{opacity:.55}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.day::before{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tabDay" aria-selected="true">Day</button>
    <button role="tab" id="tabPn" aria-selected="false"><span class="pnLabel">Notes</span> <span class="count" id="pnCount"></span></button>
  </div>
  <div id="dayView">
  <header class="day" id="day">
    <div class="day-nav">
      <button id="prev" aria-label="Previous day">‹</button>
      <button id="todayBtn" class="today" hidden>Back to today</button>
      <button id="next" aria-label="Next day">›</button>
    </div>
    <h1 class="day-title" id="dayTitle">Loading</h1>
    <div class="day-sub">
      <button class="jump" id="jumpBtn" type="button" aria-haspopup="dialog"><span id="jumpText">Connecting</span> ▾</button>
      <span id="sheetLink"></span>
    </div>
  </header>
  <nav class="week" id="week" aria-label="This week"></nav>
  <div id="banner"></div>
  <main id="main"><div class="skel"></div><div class="skel"></div></main>
  </div>
  <div id="pnView" hidden>
    <div class="pn-top"><h1 id="pnTitle">Notes</h1><span class="hint" id="pnSub"></span></div>
    <div class="pn-ctl" id="pnCtl"></div>
    <div id="pnBanner"></div>
    <div id="pnList"></div>
  </div>
</div>

<div class="bar" id="bar"><div class="bar-in">
  <div class="bar-msg" id="barMsg">No changes yet</div>
  <button class="btn" id="reviewBtn" disabled>Review and save</button>
</div></div>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <h3 id="sheetTitle">Save to your sheet</h3>
    <div class="hint" id="sheetSub"></div>
    <div id="changeList"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelSave">Keep editing</button>
      <button class="btn" id="confirmSave">Save</button>
    </div>
  </div>
</div>

<div class="cal-bg" id="calBg" role="dialog" aria-modal="true" aria-label="Choose a day">
  <div class="cal">
    <div class="cal-h"><button id="calPrev" aria-label="Previous month">‹</button><strong id="calTitle"></strong><button id="calNext" aria-label="Next month">›</button></div>
    <div class="cal-wk"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot"><span id="calLegend"><span class="sw"></span>No note yet</span><button class="btn ghost" id="calToday" type="button">Today</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
let SHEET_ID = "", TAB = "", TAB_GID = null, PARTNER = "partner";
const SERVER = "Google Sheets";
const READ_FIELDS = ["sheets.properties.sheetId","sheets.properties.title","sheets.data.rowData.values.userEnteredValue","sheets.data.rowData.values.formattedValue"];
const PLACEHOLDERS = new Set(["","—","--","-","–"]);
const DAY_LETTERS = ["S","M","Tu","W","Th","F","Sa"];
const FIRST_SERIAL = 45069; // 5/23/23, row 2

/* Column map, 0-based (A=0). Labels are page-only; sheet headers are never touched. */
const FIELDS = [
  {key:"activity", col:2,  label:"Activity", type:"text"},
  {key:"duration", col:3,  label:"Duration", type:"duration"},
  {key:"steps",    col:5,  label:"Steps",    type:"steps"},
  {key:"sleep",    col:4,  label:"Sleep",    type:"auto"},
  {key:"weight",   col:9,  label:"Weight",   type:"auto"},
  {key:"work",     col:10, label:"Work",     type:"auto"},
  {key:"calories", col:12, label:"Calories", type:"auto"}
];
const F = Object.fromEntries(FIELDS.map(f=>[f.key,f]));
const COL = {stretch:6, note:7, pn:8, protein:11};
const SUPPS = [{col:13,label:"Omega 3"},{col:14,label:"Vitamin D"},{col:15,label:"Creatine"},{col:16,label:"Iron"}];
const DEFAULT_ACTS = ["Z2 Bike","Threshold Bike","VO2 Max Bike","Tempo Bike","Glutes","Upper","Glutes + Upper","Rest"];

let mcp=null, db=null, uid=null;

/* ===================== Google sign-in + Sheets API =====================
   Personal settings (Client ID, sheet links, names) are entered in the app and saved only on each device. */
const CLIENT_ID = "";
const SCOPE = "https://www.googleapis.com/auth/spreadsheets";
const API = "https://sheets.googleapis.com/v4/spreadsheets/";
const GRID_FIELDS = "sheets(properties(sheetId,title),data(startRow,startColumn,rowData(values(userEnteredValue,formattedValue))))";
function getClientId(){ try{ return CLIENT_ID || localStorage.getItem("daily:clientId") || ""; }catch(e){ return CLIENT_ID; } }
const Auth = {
  token:null, exp:0, client:null,
  load(){ try{ const t=JSON.parse(localStorage.getItem("daily:token")||"null"); if(t&&t.exp>Date.now()+60000){ this.token=t.token; this.exp=t.exp; } }catch(e){} },
  valid(){ return (this.token && Date.now() < this.exp-60000) ? this.token : null; },
  clear(){ this.token=null; this.exp=0; try{ localStorage.removeItem("daily:token"); }catch(e){} },
  async ready(){ for(let i=0;i<100 && !(window.google&&google.accounts&&google.accounts.oauth2);i++) await new Promise(r=>setTimeout(r,100)); if(!(window.google&&google.accounts&&google.accounts.oauth2)) throw new Error("Google sign-in didn't load. Check your connection and reload."); },
  async request(){
    await this.ready();
    if(!this.client) this.client=google.accounts.oauth2.initTokenClient({client_id:getClientId(), scope:SCOPE, callback:()=>{}});
    return new Promise((res,rej)=>{
      this.client.callback=r=>{ if(r.error){ rej(new Error(r.error_description||r.error)); return; } this.token=r.access_token; this.exp=Date.now()+(+r.expires_in||3600)*1000; try{ localStorage.setItem("daily:token",JSON.stringify({token:this.token,exp:this.exp})); }catch(e){} res(this.token); };
      this.client.error_callback=e=>rej(new Error((e&&e.message)||"Sign-in was closed."));
      this.client.requestAccessToken({prompt:""});
    });
  }
};
const SheetsAPI = {
  async callTool(server, tool, args){
    const tok=Auth.valid(); if(!tok){ showReauth(); throw {code:"needs_reauth"}; }
    const opt={headers:{Authorization:"Bearer "+tok}}; let url;
    if(tool==="get_spreadsheet"){ const q=new URLSearchParams(); (args.ranges||[]).forEach(r=>q.append("ranges",r)); q.set("includeGridData","true"); q.set("fields",GRID_FIELDS); url=API+args.spreadsheetId+"?"+q; }
    else if(tool==="get_sheet_props"){ url=API+args.spreadsheetId+"?fields="+encodeURIComponent("sheets.properties(sheetId,title)"); }

/* ---------- dates ---------- */
function serialOf(y,m,d){ return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000); }

function fmtShort(p){ return p.m+"/"+p.d+"/"+String(p.y).slice(-2); }
function iso(p){ return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0"); }
function weekday(p){ return new Date(p.y,p.m-1,p.d).toLocaleDateString(undefined,{weekday:"long"}); }

function shortDate(p){ return new Date(p.y,p.m-1,p.d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function parseShort(s){ const m=String(s||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/); if(!m) return null; const y=m[3].length===2?2000+(+m[3]):+m[3]; return serialOf(y,+m[1],+m[2]); }

/* ---------- cell helpers ---------- */
const uevOf = c => (c && c.userEnteredValue) || null;
function isEmptyish(c){ const u=uevOf(c); if(!u) return true; if("stringValue" in u) return PLACEHOLDERS.has(String(u.stringValue).trim()); if("boolValue" in u) return u.boolValue===false; return false; }
function isBlank(c){ const u=uevOf(c); return !u || ("stringValue" in u && u.stringValue===""); }
function display(c){ if(!c) return ""; if(c.formattedValue!=null) return String(c.formattedValue); const u=uevOf(c); if(!u) return ""; return String(Object.values(u)[0]); }
function sameUEV(a,b){
  a=a||{}; b=b||{}; const ka=Object.keys(a), kb=Object.keys(b);
  const ea = ka.length===0 || (ka[0]==="stringValue" && a.stringValue===""), eb = kb.length===0 || (kb[0]==="stringValue" && b.stringValue==="");
  if(ea||eb) return ea&&eb;
  if(ka[0]!==kb[0]) return false;

}
function rowsEqual(r1,r2){ for(let i=0;i<17;i++) if(!sameUEV(uevOf(r1[i]),uevOf(r2[i]))) return false; return true; }
const isNum = s => /^-?\d+(\.\d+)?$/.test(String(s).trim());
function zoneOf(act){
  const a=String(act||"").toLowerCase();
  if(/vo2/.test(a)) return "vo2";
  if(/threshold|tempo|sprint|interval/.test(a)) return "thr";
  if(/glute|upper|lift|leg|pull|push|strength|arm|back/.test(a)) return "str";
  if(/z2|zone ?2|bike|ride|run|cycl|swim|walk|basketball/.test(a)) return "z2";
  return "rest";
}
function editableOf(f, c){
  const u=uevOf(c); if(!u) return "";
  if(f.type==="duration" && "numberValue" in u) return String(Math.round(u.numberValue*1440));
  if("stringValue" in u) return PLACEHOLDERS.has(u.stringValue.trim()) ? "" : u.stringValue;
  if("numberValue" in u) return String(+u.numberValue.toFixed(6));
  return display(c);
}
function parseDuration(s){
  s=String(s).trim(); let m;
  if((m=s.match(/^(\d+):(\d{1,2})$/))) return (+m[1])*60+(+m[2]);
  if((m=s.match(/^(\d+(?:\.\d+)?)$/))) return +m[1];
  if((m=s.match(/^(?:(\d+)\s*h(?:r|rs|our|ours)?)?\s*(?:(\d+)\s*m(?:in|ins)?)?$/i)) && (m[1]||m[2])) return (+(m[1]||0))*60+(+(m[2]||0));
  return null;
}
function uevFor(f, s){
  s=String(s).trim();
  if(f.type==="duration"){ const mins=parseDuration(s); return mins==null?null:{numberValue:mins/1440}; }
  if(f.type==="steps"){ const t=s.replace(/[,\s]/g,""); if(/^\d+(\.\d+)?k$/i.test(t)) return {numberValue:Math.round(parseFloat(t)*1000)}; return isNum(t)?{numberValue:+t}:{stringValue:s}; }

}
function prettyDuration(mins){ const h=Math.floor(mins/60), m=Math.round(mins%60); return h+"hr "+String(m).padStart(2,"0")+"min"; }
function joinNote(base, add){
  add=add.trim(); if(!add) return base;
  if(!base || PLACEHOLDERS.has(base.trim())) return add;

let loadToken=0;
async function loadDay(p, opts){
  opts=opts||{}; const token=++loadToken;
  state.y=p.y; state.m=p.m; state.d=p.d; state.serial=serialOf(p.y,p.m,p.d);
  const t=todayParts();
  $("todayBtn").hidden = (serialOf(t.y,t.m,t.d)===state.serial);
  $("dayTitle").textContent=weekday(p); $("jumpText").textContent=longDate(p); $("sheetLink").replaceChildren();
  if(!opts.keepBanner) banner(null);
  $("main").replaceChildren(el("div",{class:"skel"}),el("div",{class:"skel"}));
  state.rowNum=null; updateBar();
  try{
    let found = state.serial>=FIRST_SERIAL && await findRow(state.serial-45067);
    if(token!==loadToken) return;
    if(!found){
      const vals=await scanDates(); if(token!==loadToken) return;
      const idx=vals.findIndex(r=>r&&parseShort(r[0])===state.serial);
      if(idx>=0) found=await findRow(idx+1);
      if(token!==loadToken) return;
      if(!found){ renderNoRow(p, vals); return; }
    }
  }catch(e){ if(token===loadToken) renderLoadError(e); return; }
  state.draft=loadDraftLocal(state.serial);
  render();
  loadMeals(state.serial);
  applyHealthAuto(state.serial, token);
}
async function findRow(guess){
  if(guess<2) return false;
  const lo=Math.max(2,guess-6), hi=guess+1;
  const r=await readRange(TAB+"!A"+lo+":Q"+hi);
  for(let n=lo;n<=hi;n++){
    const u=uevOf(r.rows[n]&&r.rows[n][1]);
    if(u && u.numberValue===state.serial){
      state.rowNum=n; state.row=padRow(r.rows[n]); state.rev=r.rev;
      state.window=[]; for(let k=n-6;k<=n;k++) if(k>=2) state.window.push({n:k,row:padRow(r.rows[k]||[])});
      return true;
    }
  }
  return false;
}
const padRow = r => { const a=(r||[]).slice(0,17); while(a.length<17) a.push({}); return a; };

/* No row: offer to add rows at the bottom, only if the date comes after the last dated row. */
function renderNoRow(p, vals){
  $("week").replaceChildren(); setZone("rest");
  let lastRow=-1, lastSerial=null;
  for(let i=vals.length-1;i>=0;i--){ const s=parseShort(vals[i]&&vals[i][0]); if(s!=null){ lastRow=i+1; lastSerial=s; break; } }
  const sec=el("section",{},[el("h2",{text:"No row for "+fmtShort(p)+" yet"})]);
  const gap = lastSerial!=null ? state.serial-lastSerial : 0;
  if(lastSerial!=null && gap>0 && gap<=62){
    const first=fromSerial(lastSerial+1);
    sec.append(el("div",{class:"hint",text:"Your sheet's last day is "+shortDate(fromSerial(lastSerial))+" in row "+lastRow+". I can add "+(gap===1?"a row for "+shortDate(p):gap+" rows ("+shortDate(first)+" to "+shortDate(p)+")")+" right below it, with the day and date filled in, and the same formatting as row "+lastRow+". I'll check those rows are completely empty first."}));
    sec.append(el("button",{class:"btn",style:"margin-top:10px",text:gap===1?"Add this day's row":"Add "+gap+" rows",onclick:()=>addRows(lastRow,lastSerial,gap,p)}));
  } else {
    sec.append(el("div",{class:"hint",text:"Your "+TAB+" tab doesn't have a row with this date, and it isn't right after your last row, so the page won't create one. Add it in the sheet if you need it."}));
  }
  $("main").replaceChildren(sec);

async function addRows(lastRow, lastSerial, gap, p){
  banner("info","Checking the rows below row "+lastRow+" are empty…");
  try{
    const lo=lastRow+1, hi=lastRow+gap;
    const r=await readRange(TAB+"!A"+lastRow+":Q"+hi);
    const lastB=uevOf((r.rows[lastRow]||[])[1]);
    if(!lastB || lastB.numberValue!==lastSerial){ banner("err","Nothing was added. Row "+lastRow+" changed since the page looked. Reloading."); return loadDay(p,{keepBanner:true}); }
    for(let n=lo;n<=hi;n++){ const row=r.rows[n]||[]; if(row.some(c=>!isBlank(c) && !(uevOf(c)&&uevOf(c).boolValue===false))){ banner("err","Nothing was added. Row "+n+" already has something in it, so the page won't write there. Check the sheet."); return; } }
    const requests=[{copyPaste:{source:{sheetId:TAB_GID,startRowIndex:lastRow-1,endRowIndex:lastRow,startColumnIndex:0,endColumnIndex:17},destination:{sheetId:TAB_GID,startRowIndex:lo-1,endRowIndex:hi,startColumnIndex:0,endColumnIndex:17},pasteType:"PASTE_FORMAT"}}];
    const rows=[];
    for(let k=1;k<=gap;k++){ const s=lastSerial+k, pd=fromSerial(s); rows.push({values:[{userEnteredValue:{stringValue:DAY_LETTERS[new Date(pd.y,pd.m-1,pd.d).getDay()]}},{userEnteredValue:{numberValue:s}}]}); }
    requests.push({updateCells:{start:{sheetId:TAB_GID,rowIndex:lo-1,columnIndex:0},rows,fields:"userEnteredValue"}});
    requests.push({updateCells:{start:{sheetId:TAB_GID,rowIndex:lo-1,columnIndex:6},rows:rows.map(()=>({values:[{userEnteredValue:{boolValue:false}}]})),fields:"userEnteredValue"}});
    requests.push({updateCells:{start:{sheetId:TAB_GID,rowIndex:lo-1,columnIndex:13},rows:rows.map(()=>({values:SUPPS.map(()=>({userEnteredValue:{boolValue:false}}))})),fields:"userEnteredValue"}});
    banner("info","Adding rows…");
    let werr=null; try{ await writeRequests(requests, r.rev); }catch(e){ werr=e; }
    const check=await readRange(TAB+"!B"+lo+":B"+hi);
    const ok=[...Array(gap)].every((_,i)=>{ const u=uevOf((check.rows[lo+i]||[])[0]); return u&&u.numberValue===lastSerial+i+1; });
    if(ok){ for(const k in calCache) delete calCache[k]; banner("ok","Added rows "+lo+" to "+hi+"."); return loadDay(p,{keepBanner:true}); }
    banner("err","Nothing was added"+(werr?(": "+errText(werr)):"")+". The sheet may have been edited at the same moment. Try again.");
  }catch(e){ banner("err","Nothing was added. "+errText(e)); }
}
function renderLoadError(e){ $("main").replaceChildren(); banner("err", errText(e), "Try again", ()=>loadDay({y:state.y,m:state.m,d:state.d})); }

/* To-do: checklist built from the day's pre-written note. Saved with the page only, never written to the sheet. */
function splitItems(text){
  const out=[]; let cur="", depth=0;
  for(const ch of String(text||"")){ if(ch==="("||ch==="[") depth++; if((ch===")"||ch==="]")&&depth>0) depth--; if((ch===","||ch==="\n")&&depth===0){ out.push(cur); cur=""; } else cur+=ch; }
  out.push(cur); return out.map(x=>x.trim()).filter(Boolean);
}

function todoCard(){
  const row=state.row, serial=state.serial;

  const same=()=>items.length===splitItems(sheetNote).length && items.every((it,i)=>!it.done && it.t===splitItems(sheetNote)[i]);
  const persist=()=>{ reset.hidden=same(); st.textContent="Saving…"; clearTimeout(todoTimer); todoTimer=setTimeout(async()=>{ try{ await storeSet("todo-"+serial,{items:items.filter(i=>i.t.trim())}); if(state.serial===serial) st.textContent="Saved"; }catch(e){ st.textContent="Saved on this device"; } },500); };

      tick.addEventListener("click",()=>{ it.done=!it.done; tick.setAttribute("aria-checked",String(it.done)); li.classList.toggle("done",it.done); persist(); });
      inp.addEventListener("input",()=>{ it.t=inp.value; persist(); });
      inp.addEventListener("blur",()=>{ if(!it.t.trim()){ items.splice(items.indexOf(it),1); draw(); persist(); } });
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); items.splice(i+1,0,{t:"",done:false}); draw(i+1); } });

  };

/* ---------- Apple Health (via iPhone Shortcut → clipboard) ---------- */
function parseHealth(text){
  const t=String(text||""); const out={};
  const sm=t.match(/steps\s*[=:]\s*([\d,\.]+)/i); if(sm){ const n=Math.round(parseFloat(sm[1].replace(/,/g,""))); if(n>=0) out.steps=n; }
  const sl=t.match(/sleep\s*[=:]\s*([\d,\.]+)/i);
  if(sl){ let h=parseFloat(sl[1].replace(/,/g,"")); if(h>1440) h/=3600; else if(h>24) h/=60; if(h>0) out.sleep=Math.round(h*10)/10; }
  return out;
}
function applyHealth(vals, raw){
  const bad=[];
  if(vals.steps!=null && vals.steps>60000){ bad.push(vals.steps.toLocaleString()+" steps"); vals.steps=null; }
  if(vals.sleep!=null && vals.sleep>16){ bad.push(vals.sleep+" hrs sleep"); vals.sleep=null; }
  const set=(key,v)=>{ const inp=document.getElementById("f-"+key); if(inp&&v!=null){ inp.value=String(v); inp.dispatchEvent(new Event("input")); } };
  set("steps",vals.steps); set("sleep",vals.sleep);
  const parts=[]; if(vals.steps!=null) parts.push(vals.steps.toLocaleString()+" steps"); if(vals.sleep!=null) parts.push(vals.sleep+" hrs sleep");
  const copied=" The shortcut copied: \u201c"+String(raw||"").trim().slice(0,160)+"\u201d";
  if(bad.length) banner("err",(parts.length?"Filled in "+parts.join(" and ")+". ":"")+"Skipped "+bad.join(" and ")+" because that's more than one day could hold, so the shortcut is likely counting duplicate sources or more than one day."+copied);
  else banner("ok","Filled in "+parts.join(" and ")+" from Apple Health. Review and save when ready."+copied);
}
function healthButton(){
  const b=el("button",{class:"pill",type:"button",text:"From Health"});
  b.addEventListener("click",async()=>{
    let text=null;
    try{ if(navigator.clipboard&&navigator.clipboard.readText) text=await navigator.clipboard.readText(); }catch(e){ text=null; }
    const v=parseHealth(text);
    if(v.steps!=null||v.sleep!=null) return applyHealth(v,text);
    showHealthPaste();
  });
  return b;
}
function showHealthPaste(){
  const b=$("banner"); b.replaceChildren();
  const inp=el("input",{type:"text",placeholder:"Paste here","aria-label":"Paste Health data"});
  const box=el("div",{class:"banner info"},[el("div",{text:"Run your Health shortcut, then paste what it copied here."}),inp]);
  inp.style.marginTop="8px";
  inp.addEventListener("input",()=>{ const v=parseHealth(inp.value); if(v.steps!=null||v.sleep!=null) applyHealth(v,inp.value); });
  b.append(box); inp.focus();
}

function noteSection(title, key, col, ph){
  const d=state.draft; const addK=key+"Add", repK=key+"Replace";
  const existing=display(state.row[col]); const has=!isEmptyish(state.row[col]);
  const sec=el("section",{}); const body=el("div");
  const draw=()=>{
    body.replaceChildren();
    const head=el("div",{class:"sh"},[el("h2",{text:title})]);
    if(d[repK]!=null){
      const ta=el("textarea",{rows:"6","aria-label":"Edit whole "+title.toLowerCase()}); ta.value=d[repK]; ta.classList.add("changed");
      ta.addEventListener("input",()=>{ d[repK]=ta.value; changed(); });
      head.append(el("button",{class:"linkish",type:"button",text:"Cancel",onclick:()=>{ d[repK]=null; draw(); changed(); }}));
      body.append(head, ta, el("div",{class:"hint",text:"You're editing the whole note. Saving will ask you to confirm replacing what's in the sheet."}));
      return;
    }
    if(has) head.append(el("button",{class:"linkish",type:"button",text:"Edit whole note",onclick:()=>{ d[repK]=joinNote(existing,d[addK]||""); d[addK]=""; draw(); changed(); }}));
    const paper=el("div",{class:"paper"});
    const ta=el("textarea",{rows:"3",placeholder:ph,"aria-label":ph}); ta.value=d[addK]||"";
    const sync=()=>{
      const add=ta.value.trim(); ta.classList.toggle("changed",!!add);
      if(!has && !add){ paper.className="paper empty"; paper.textContent="Nothing here yet"; return; }
      paper.className="paper";
      const full=joinNote(has?existing:"",add);

      if(add) paper.scrollTop=paper.scrollHeight;

/* ---------- change set ---------- */
function computeChanges(){
  const d=state.draft, row=state.row, out=[];
  for(const f of FIELDS){
    const v=d.fields[f.key]; if(v==null||!v.trim()) continue;
    const u=uevFor(f,v); if(!u) continue;
    const c=row[f.col]; if(sameUEV(u,uevOf(c))) continue;
    const after = f.type==="duration"?prettyDuration(u.numberValue*1440):("numberValue" in u && f.type==="steps")?u.numberValue.toLocaleString():v.trim();
    out.push({col:f.col,label:f.label,before:display(c),after,uev:u,kind:isEmptyish(c)?"fill":"replace"});
  }
  if(d.stretch!=null){ const c=row[COL.stretch]; out.push({col:COL.stretch,label:"Stretched",before:display(c)||"empty",after:d.stretch?"TRUE":"FALSE",uev:{boolValue:d.stretch},kind:(d.stretch||isEmptyish(c))?"fill":"replace"}); }
  for(const sp of SUPPS){ const v=d.supps[sp.col]; if(v==null) continue; const c=row[sp.col]; if(sameUEV({boolValue:v},uevOf(c))) continue; out.push({col:sp.col,label:sp.label,before:display(c)||"empty",after:v?"TRUE":"FALSE",uev:{boolValue:v},kind:(v||isEmptyish(c))?"fill":"replace"}); }
  const pf=proteinFormula(d.proteinAdds);
  if(pf){ const c=row[COL.protein]; out.push({col:COL.protein,label:"Protein",before:(uevOf(c)&&uevOf(c).formulaValue)||display(c)||"empty",after:pf,uev:{formulaValue:pf},kind:isEmptyish(c)?"fill":"append"}); }
  for(const [key,col,label] of [["note",COL.note,"Note"],["pn",COL.pn,"Note to "+PARTNER]]){
    const c=row[col], u=uevOf(c), base=(u&&u.stringValue!=null&&!isEmptyish(c))?u.stringValue:(isEmptyish(c)?"":display(c));
    if(d[key+"Replace"]!=null){
      const nv=d[key+"Replace"]; if(!nv.trim()||nv===base) continue;
      out.push({col,label,before:display(c),after:nv,uev:{stringValue:nv},kind:isEmptyish(c)?"fill":((base&&nv.startsWith(base))?"append":"replace")});
    } else if((d[key+"Add"]||"").trim()){
      const nv=joinNote(base,d[key+"Add"]);
      out.push({col,label,before:display(c),after:nv,uev:{stringValue:nv},kind:isEmptyish(c)?"fill":"append"});
    }
  }
  return out;
}
function changed(){ saveDraftLocal(); updateBar(); }
function updateBar(){
  if(!state.draft||!state.rowNum){ $("barMsg").textContent="No changes yet"; $("reviewBtn").disabled=true; return; }
  const n=computeChanges().length;
  $("barMsg").textContent = n? (n+" unsaved change"+(n>1?"s":"")+", "+shortDate(state)) : "No changes yet";
  $("reviewBtn").disabled = !n || state.busy;
}

/* ---------- review & save ---------- */
let pendingChanges=[];
function openReview(){
  pendingChanges=computeChanges(); if(!pendingChanges.length) return;
  const list=$("changeList"); list.replaceChildren();
  $("sheetSub").textContent="Row "+state.rowNum+", "+weekday(state)+" "+fmtShort(state)+". Only these cells will change.";
  pendingChanges.forEach(ch=>{
    const tagText = ch.kind==="fill"?"Fills empty cell":ch.kind==="append"?"Adds to existing":"Replaces existing";
    const box=el("div",{class:"ch"},[
      el("div",{class:"ch-h"},[el("span",{text:ch.label}),el("span",{class:"tag"+(ch.kind==="replace"?" rep":""),text:tagText})]),
      ch.kind!=="fill"?el("div",{class:"ba"},[el("b",{text:"Now: "}),el("span",{class:"v",text:ch.before||"empty"})]):null,
      el("div",{class:"ba"},[el("b",{text:ch.kind==="fill"?"Will be: ":"After: "}),el("span",{class:"v",text:ch.after})])
    ]);
    if(ch.kind==="replace"){
      ch.ok=false; const cb=el("input",{type:"checkbox"}); cb.addEventListener("change",()=>{ ch.ok=cb.checked; syncSaveBtn(); });
      box.append(el("label",{class:"confirm"},[cb,el("span",{text:"Yes, replace what's in the sheet. Unticked replacements are skipped."})]));
    } else ch.ok=true;
    list.append(box);
  });
  syncSaveBtn(); $("sheetBg").classList.add("open"); $("confirmSave").focus();
}
function syncSaveBtn(){ const n=pendingChanges.filter(c=>c.ok).length; $("confirmSave").disabled=!n; $("confirmSave").textContent = n? ("Save "+n+" change"+(n>1?"s":"")) : "Nothing to save"; }
function closeReview(){ $("sheetBg").classList.remove("open"); }

async function doSave(){
  const toWrite=pendingChanges.filter(c=>c.ok); if(!toWrite.length) return;
  closeReview(); state.busy=true; updateBar(); banner("info","Saving…");
  const snapshot=state.row.slice(), rowNum=state.rowNum, serial=state.serial;
  const requests=toWrite.map(ch=>({updateCells:{start:{sheetId:TAB_GID,rowIndex:rowNum-1,columnIndex:ch.col},rows:[{values:[{userEnteredValue:ch.uev}]}],fields:"userEnteredValue"}}));
  const readBack=async()=>{ const r=await readRange(TAB+"!A"+rowNum+":Q"+rowNum); return {row:padRow(r.rows[rowNum]), rev:r.rev}; };
  const allIn=row=>toWrite.every(ch=>sameUEV(uevOf(row[ch.col]),ch.uev));
  const fail=msg=>{ state.busy=false; updateBar(); banner("err",msg); };
  const success=(row,rev)=>{
    state.busy=false; clearSavedParts(toWrite); state.row=row; state.rev=rev; delete calCache[state.y+"-"+state.m];
    const w=state.window.find(x=>x.n===rowNum); if(w) w.row=row;
    render(); loadMeals(serial);
    banner("ok","Saved "+toWrite.length+" change"+(toWrite.length>1?"s":"")+" to row "+rowNum+".");
  };
  const conflict=(row,rev)=>{
    state.busy=false; state.row=row; state.rev=rev; render(); loadMeals(serial);
    banner("err","Nothing was saved. This row was edited in the sheet since you opened it, so the page loaded the latest version. Your unsaved additions are kept; review them again before saving.");
  };

  // Fast path: write locked to the sheet version this row was loaded at.
  // Google rejects it if anything in the spreadsheet changed since then.
  let werr=null;
  if(state.rev){ try{ await writeRequests(requests, state.rev); }catch(e){ werr=e; } } else werr={message:"no version"};
  let a1;
  try{ a1=await readBack(); }
  catch(e){ return fail("Couldn't confirm whether the save went through ("+errText(e)+"). Open the sheet to check row "+rowNum+" before trying again."); }
  const b1=uevOf(a1.row[1]);
  if(!b1 || b1.numberValue!==serial){ state.busy=false; banner("err","Nothing was saved. Row "+rowNum+" no longer holds this date (rows may have moved). Reloading."); return loadDay(fromSerial(serial),{keepBanner:true}); }
  if(allIn(a1.row)) return success(a1.row, a1.rev);
  if(!rowsEqual(a1.row, snapshot)) return conflict(a1.row, a1.rev);

  // The fast write was rejected because something else in the spreadsheet changed,
  // but this row is exactly as you reviewed it, so write again locked to the version just read.
  werr=null;
  try{ await writeRequests(requests, a1.rev); }catch(e){ werr=e; }
  let a2;
  try{ a2=await readBack(); }
  catch(e){ return fail("Couldn't confirm whether the save went through ("+errText(e)+"). Open the sheet to check row "+rowNum+" before trying again."); }
  if(allIn(a2.row)) return success(a2.row, a2.rev);
  if(rowsEqual(a2.row, snapshot)){ state.rev=a2.rev; return fail("Nothing was saved"+(werr&&werr.code?(": "+errText(werr)):"")+". The spreadsheet was being edited at the same moment, so Google rejected the write to be safe. Your row is untouched. Tap Review and save to try again."); }
  return conflict(a2.row, a2.rev);
}
function clearSavedParts(written){
  const d=state.draft; const cols=new Set(written.map(w=>w.col));
  for(const f of FIELDS) if(cols.has(f.col)) delete d.fields[f.key];
  if(cols.has(COL.stretch)) d.stretch=null;
  for(const sp of SUPPS) if(cols.has(sp.col)) delete d.supps[sp.col];
  if(cols.has(COL.protein)) d.proteinAdds=[];
  if(cols.has(COL.note)){ d.noteAdd=""; d.noteReplace=null; }
  if(cols.has(COL.pn)){ d.pnAdd=""; d.pnReplace=null; }
  saveDraftLocal();
}

/* ---------- Apple Health via Google Form responses (separate spreadsheet, read-only) ---------- */
let HEALTH_SHEET="";
let healthCache=null, healthAt=0;
async function healthRows(){
  if(!HEALTH_SHEET) return {};
  if(healthCache && Date.now()-healthAt<60000) return healthCache;
  const res=await mcp.callTool(SERVER,"get_values",{spreadsheetId:HEALTH_SHEET, range:"A1:E3000"},{cache:false});
  const p=parsePayload(res); const vals=(p&&p.values)||[];
  const head=(vals[0]||[]).map(h=>String(h).toLowerCase());
  const iTs=head.findIndex(h=>/timestamp/.test(h)), iDate=head.findIndex(h=>/date/.test(h)&&!/timestamp/.test(h)), iSteps=head.findIndex(h=>/steps/.test(h)), iSleep=head.findIndex(h=>/sleep/.test(h));
  const byDay={};
  vals.slice(1).forEach(r=>{ const s=parseShort(r[iDate]); if(s==null) return; byDay[s]={ts:iTs>=0?r[iTs]:"", steps:r[iSteps], sleep:r[iSleep]}; }); // later rows win
  healthCache=byDay; healthAt=Date.now(); return byDay;
}
async function applyHealthAuto(serial, token){
  let h;
  try{ h=(await healthRows())[serial]; }
  catch(e){ if(token===loadToken && e && (e.code==="tool_error")) banner("info","The log can't read your Health responses spreadsheet. Share it (Viewer is enough) with the Google account you sign in with, or fix the link in Settings."); return; }
  if(!h || token!==loadToken || state.serial!==serial || !state.draft) return;
  const vals=parseHealth("steps="+(h.steps||"")+" sleep="+(h.sleep||""));
  const filled=[], newer=[];
  for(const key of ["steps","sleep"]){
    const v=vals[key]; if(v==null) continue;
    if(key==="steps"&&v>60000 || key==="sleep"&&v>16) continue;
    const f=F[key], cell=state.row[f.col], inp=document.getElementById("f-"+key);
    if(!inp || state.draft.fields[key]!=null) continue;
    if(isEmptyish(cell)){ inp.value=String(v); inp.dispatchEvent(new Event("input")); filled.push(key==="steps"?v.toLocaleString()+" steps":v+" hrs sleep"); }
    else if(!sameUEV(uevFor(f,String(v)),uevOf(cell))) newer.push({key,v});
  }
  const when=h.ts?" (sent "+h.ts+")":"";
  if(filled.length) banner("ok","Filled in "+filled.join(" and ")+" from Apple Health"+when+". Review and save when ready.");
  else if(newer.length) banner("info","Apple Health has different numbers for this day"+when+": "+newer.map(n=>n.key==="steps"?n.v.toLocaleString()+" steps":n.v+" hrs sleep").join(" and ")+".","Use these",()=>{
    newer.forEach(n=>{ const inp=document.getElementById("f-"+n.key); if(inp){ inp.value=String(n.v); inp.dispatchEvent(new Event("input")); } }); banner(null);
  });
}

/* ---------- Partner tab: past days with an empty partner note, oldest first ---------- */
let pnItems=null, pnShown=0, pnDirty=false, pnSeq=null;
let pnOrder=(()=>{ try{ return localStorage.getItem("daily:pnOrder")==="shuffle"?"shuffle":"oldest"; }catch(e){ return "oldest"; } })();
function buildPnSeq(){
  const pend=pnItems.filter(x=>!x.saved);
  if(pnOrder==="shuffle"){ for(let i=pend.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pend[i],pend[j]]=[pend[j],pend[i]]; } }
  else pend.sort((a,b)=>a.serial-b.serial);
  pnSeq=pend;
}
function setPnOrder(mode){
  pnOrder=mode; try{ localStorage.setItem("daily:pnOrder",mode); }catch(e){}
  renderPnControls(); if(!pnItems) return;
  const list=$("pnList"); list.replaceChildren(); pnShown=0; buildPnSeq(); morePn(); window.scrollTo(0,0);
}
function renderPnControls(){
  const sh=pnOrder==="shuffle";
  $("pnCtl").replaceChildren(
    el("button",{class:"pill",type:"button","aria-pressed":String(sh),text:sh?"Shuffle again":"Shuffle",onclick:()=>setPnOrder("shuffle")}),
    el("button",{class:"pill",type:"button","aria-pressed":String(!sh),text:"Oldest first",onclick:()=>{ if(pnOrder!=="oldest") setPnOrder("oldest"); }}));
}
const PN_PAGE=15;
async function loadPn(force){
  if(pnItems && !force) return pnItems;
  const t=todayParts(), todayS=serialOf(t.y,t.m,t.d), last=todayS-45067+2;
  const res=await mcp.callTool(SERVER,"get_values",{spreadsheetId:SHEET_ID, range:TAB+"!A2:I"+last},{cache:false});
  const p=parsePayload(res); const vals=(p&&p.values)||[];
  const out=[];
  vals.forEach((r,i)=>{ const s=parseShort(r[1]); if(s==null||s>todayS) return; const w=r[8]; if(w!=null && String(w).trim()!=="") return; out.push({rowNum:i+2,serial:s,act:r[2]||"",note:r[7]||""}); });
  out.sort((a,b)=>a.serial-b.serial);
  pnItems=out; updatePnCount(); return out;
}
function updatePnCount(){ const n=pnItems?pnItems.filter(x=>!x.saved).length:null; $("pnCount").textContent=n==null?"":"("+n+")"; $("pnSub").textContent=n==null?"":(n?n+" days to go":"All caught up"); }
async function showPn(){
  $("tabDay").setAttribute("aria-selected","false"); $("tabPn").setAttribute("aria-selected","true");
  $("dayView").hidden=true; $("bar").hidden=true; $("pnView").hidden=false;
  const list=$("pnList");
  if(!pnItems){ list.replaceChildren(el("div",{class:"skel"}),el("div",{class:"skel"})); }
  try{ await loadPn(); }catch(e){ list.replaceChildren(); $("pnBanner").replaceChildren(el("div",{class:"banner err",text:errText(e)})); return; }
  renderPnControls();
  if(!list.querySelector(".pn-card")){ list.replaceChildren(); pnShown=0; buildPnSeq(); morePn(); }
}
function showDay(){
  $("tabDay").setAttribute("aria-selected","true"); $("tabPn").setAttribute("aria-selected","false");
  $("pnView").hidden=true; $("dayView").hidden=false; $("bar").hidden=false;
  if(pnDirty && state.serial){ pnDirty=false; loadDay(fromSerial(state.serial)); }
}
function morePn(){
  const list=$("pnList"); const old=list.querySelector(".pn-more"); if(old) old.remove();
  const pending=pnItems.filter(x=>!x.saved);
  if(!pending.length){ list.append(el("section",{},[el("h2",{text:"All caught up"}),el("div",{class:"hint",text:"Every past day has a note to "+PARTNER+"."})])); return; }
  if(!pnSeq) buildPnSeq();
  pnSeq.slice(pnShown, pnShown+PN_PAGE).forEach(it=>{ if(!it.saved) list.append(pnCard(it)); });
  pnShown+=PN_PAGE;
  if(pnShown<pnSeq.length) list.append(el("button",{class:"btn ghost pn-more",style:"width:100%;margin-top:10px",text:"Show "+Math.min(PN_PAGE,pnSeq.length-pnShown)+" more",onclick:morePn}));
}
function pnCard(it){
  const pd=fromSerial(it.serial);
  const draft=loadDraftLocal(it.serial);
  const ta=el("textarea",{rows:"2",placeholder:"Note to "+PARTNER,"aria-label":"Note to "+PARTNER+" for "+longDate(pd)}); ta.value=draft.pnAdd||"";
  const msg=el("span",{class:"msg"});
  const btn=el("button",{class:"btn",type:"button",text:"Save"}); btn.disabled=!ta.value.trim();
  ta.addEventListener("input",()=>{ btn.disabled=!ta.value.trim(); const d=loadDraftLocal(it.serial); d.pnAdd=ta.value; try{ if(draftEmpty(d)) localStorage.removeItem(draftKey(it.serial)); else localStorage.setItem(draftKey(it.serial),JSON.stringify(d)); }catch(e){} });
  const ctx=it.note&&!PLACEHOLDERS.has(String(it.note).trim())?el("div",{class:"pn-ctx",text:it.note,title:"Tap to expand"}):null;
  if(ctx) ctx.addEventListener("click",()=>ctx.classList.toggle("open"));
  const card=el("section",{class:"pn-card"},[
    el("div",{class:"wd-line"},[el("strong",{text:new Date(pd.y,pd.m-1,pd.d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}),
      el("a",{href:"https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit#gid="+TAB_GID+"&range=I"+it.rowNum,target:"_blank",rel:"noopener",text:"Row "+it.rowNum})]),
    it.act&&!PLACEHOLDERS.has(String(it.act).trim())?el("div",{class:"pn-act",text:it.act}):null,
    ctx, ta, el("div",{class:"pn-row"},[msg,btn])
  ]);
  btn.addEventListener("click",async()=>{
    const text=ta.value.trim(); if(!text) return;
    btn.disabled=true; ta.disabled=true; msg.className="msg"; msg.textContent="Saving…";
    const r=await savePnCell(it, text);
    if(r.ok){
      it.saved=true; pnDirty=true; updatePnCount();
      const d=loadDraftLocal(it.serial); d.pnAdd=""; try{ if(draftEmpty(d)) localStorage.removeItem(draftKey(it.serial)); else localStorage.setItem(draftKey(it.serial),JSON.stringify(d)); }catch(e){}
      card.classList.add("done"); msg.textContent="Saved to row "+it.rowNum;
      setTimeout(()=>{ card.remove(); if(!pnItems.some(x=>!x.saved)) morePn(); },900);
    } else {
      msg.className="msg err"; msg.textContent=r.msg; ta.disabled=false; btn.disabled=false;
      if(r.taken){ it.saved=true; updatePnCount(); btn.disabled=true; ta.disabled=true; }
    }
  });
  return card;
}
async function savePnCell(it, text){
  const rowNum=it.rowNum;
  let fresh;
  try{ fresh=await readRange(TAB+"!A"+rowNum+":Q"+rowNum); }catch(e){ return {ok:false,msg:"Not saved. "+errText(e)}; }
  const row=padRow(fresh.rows[rowNum]);
  const b=uevOf(row[1]);
  if(!b || b.numberValue!==it.serial) return {ok:false,taken:true,msg:"Not saved. Row "+rowNum+" no longer holds this date, so rows may have moved. Reload the page."};
  if(!isBlank(row[COL.pn])) return {ok:false,taken:true,msg:"Not saved. This day already has a partner note now: “"+display(row[COL.pn]).slice(0,80)+"”"};
  const uev={stringValue:text};
  let werr=null;
  try{ await writeRequests([{updateCells:{start:{sheetId:TAB_GID,rowIndex:rowNum-1,columnIndex:COL.pn},rows:[{values:[{userEnteredValue:uev}]}],fields:"userEnteredValue"}}], fresh.rev); }catch(e){ werr=e; }
  let after;
  try{ after=padRow((await readRange(TAB+"!A"+rowNum+":Q"+rowNum)).rows[rowNum]); }catch(e){ return {ok:false,msg:"Couldn't confirm the save ("+errText(e)+"). Check row "+rowNum+" before trying again."}; }
  if(sameUEV(uevOf(after[COL.pn]),uev)) return {ok:true};
  if(isBlank(after[COL.pn])) return {ok:false,msg:"Not saved"+(werr?(": "+errText(werr)):"")+". The sheet was being edited at the same moment, so Google rejected it to be safe. Tap Save again."};
  return {ok:false,taken:true,msg:"Not saved. Someone just wrote a partner note here: “"+display(after[COL.pn]).slice(0,80)+"”"};
}

/* ---------- calendar ---------- */
const calCache={}; let calY=0, calM=0;
async function monthInfo(y,m){
  const key=y+"-"+m; if(calCache[key]) return calCache[key];
  const s1=serialOf(y,m,1), sN=serialOf(m===12?y+1:y,m===12?1:m+1,1)-1;
  const r1=Math.max(2,s1-45067-3), rN=sN-45067+3; const info={};
  if(rN>=2){
    const r=await readRange(TAB+"!A"+r1+":H"+rN);
    for(const n in r.rows){ const row=padRow(r.rows[n]); const u=uevOf(row[1]); if(u&&typeof u.numberValue==="number") info[u.numberValue]={act:display(row[2]),noNote:isEmptyish(row[COL.note])}; }
  }
  calCache[key]=info; return info;
}
function openCal(){ calY=state.y; calM=state.m; drawCal(); $("calBg").classList.add("open"); }
function closeCal(){ $("calBg").classList.remove("open"); }
function shiftCal(n){ calM+=n; if(calM<1){calM=12;calY--;} if(calM>12){calM=1;calY++;} drawCal(); }
async function drawCal(){
  const y=calY, m=calM; const grid=$("calGrid");
  $("calTitle").textContent=new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const t=todayParts(), todayS=serialOf(t.y,t.m,t.d);
  const cells=(info)=>{
    const out=[]; const lead=new Date(y,m-1,1).getDay(); const days=new Date(y,m,0).getDate();
    for(let i=0;i<lead;i++) out.push(el("span"));
    for(let d=1;d<=days;d++){
      const s=serialOf(y,m,d), it=info&&info[s];
      const cls=["cd"]; if(info&&!it&&s<FIRST_SERIAL) cls.push("none");
      if(it&&it.noNote&&s<todayS) cls.push("blank");
      if(s===todayS) cls.push("today");
      const b=el("button",{class:cls.join(" "),type:"button","aria-current":s===state.serial?"date":false,"aria-label":longDate({y,m,d})+(it&&it.noNote&&s<todayS?", no note yet":""),onclick:()=>{ if(s<FIRST_SERIAL) return; closeCal(); go({y,m,d}); }},[document.createTextNode(String(d)),el("span",{class:"z"})]);
      if(it&&it.act&&!PLACEHOLDERS.has(it.act)) b.style.setProperty("--z","var(--"+zoneOf(it.act)+")");
      out.push(b);
    }
    return out;
  };
  grid.replaceChildren(...cells(calCache[y+"-"+m]||null));
  if(!calCache[y+"-"+m]){
    try{ const info=await monthInfo(y,m); if(calY===y&&calM===m) grid.replaceChildren(...cells(info)); }
    catch(e){ if(calY===y&&calM===m) $("calLegend").textContent="Couldn't load highlights: "+errText(e); }
  }
}

/* ---------- wiring ---------- */
const go = p => { if(mcp) loadDay(p); };
$("prev").addEventListener("click",()=>go(fromSerial(state.serial-1)));
$("next").addEventListener("click",()=>go(fromSerial(state.serial+1)));
$("todayBtn").addEventListener("click",()=>go(todayParts()));
$("jumpBtn").addEventListener("click",()=>{ if(mcp) openCal(); });

$("calNext").addEventListener("click",()=>shiftCal(1));

$("calBg").addEventListener("click",e=>{ if(e.target===$("calBg")) closeCal(); });
$("reviewBtn").addEventListener("click",openReview);
$("tabDay").addEventListener("click",showDay);
$("tabPn").addEventListener("click",()=>{ if(mcp) showPn(); });
$("cancelSave").addEventListener("click",closeReview);

$("sheetBg").addEventListener("click",e=>{ if(e.target===$("sheetBg")) closeReview(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeReview(); closeCal(); } });

$("dayTitle").textContent=weekday(t0); $("jumpText").textContent=longDate(t0);
(async()=>{
  importSetupFromHash(); loadConfig(); loadSnacks();

  const start=async()=>{ mcp=SheetsAPI; try{ await resolveTab(); }catch(e){ $("main").replaceChildren(); banner("err",errText(e),"Open Settings",showSetup); return; } loadDay(t0); loadPn().catch(()=>{}); };
  Auth.load();
  if(Auth.valid()) return start();
  showSignIn(start);
})();
})();
